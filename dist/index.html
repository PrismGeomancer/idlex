<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Plan tasks and organize your AI agents in one workspace. Write clear briefs, choose preferred agents, and export reusable plans to your execution tools."
    />
    <title>IDLE — Clear plans for your AI agents</title>
    <link rel="icon" type="image/svg+xml" href="logo.svg" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <aside class="sidebar">
      <a class="brand" href="#introduction" aria-label="IDLE introduction"
        ><img src="logo.svg" alt="" width="32" height="32" />IDLE</a
      >
      <div class="workspace">
        <span class="workspace-icon">I</span>
        <div>Default workspace<small>Solana</small></div>
      </div>
      <div class="nav-label">WORKSPACE</div>
      <nav id="nav"></nav>
      <div class="sidebar-bottom">
        <div class="system-state"><i class="dot"></i> Solana</div>
        <button class="version" data-nav="docs">IDLE workspace v1.0</button>
        <div class="profile">
          <span class="avatar">D</span>
          <div>Guest workspace<small>Connect your Solana wallet</small></div>
        </div>
      </div>
    </aside>
    <div class="shell">
      <header class="topbar">
        <a class="landing-brand" href="#introduction" aria-label="IDLE introduction"><img src="logo.svg" width="32" height="32" alt="">IDLE</a>
        <nav class="landing-nav" aria-label="Introduction navigation"><button data-nav="docs">How IDLE works</button><button data-nav="overview">Open workspace <span aria-hidden="true">↗</span></button></nav>
        <div class="breadcrumb">
          <span class="breadcrumb-root">Workspace</span
          ><span class="breadcrumb-separator">/</span>
          <b id="crumb">Introduction</b>
        </div>
        <div class="top-actions">
          <span class="devnet">SOLANA</span
          ><button class="outline small" id="connect-top">
            Connect wallet
          </button>
        </div>
      </header>
      <div id="storage-notice" role="status" hidden></div>
      <main id="app"></main>
      <footer>
        <span>© 2026 IDLE · Put idle intelligence to work.</span
        ><span
          >Solana <span class="footer-dot">•</span> Plan. Save. Reuse.</span
        >
      </footer>
    </div>
    <dialog id="modal"><div id="modal-content"></div></dialog>
    <div id="toast" role="status" aria-live="polite"></div>
    <script defer src="app.bundle.js"></script>
  </body>
</html>
